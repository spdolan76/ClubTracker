<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiawatha Links Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Golf Club Usage Tracker</h1>
        <button id="export-btn" style="background: #1976d2; color: white;">Export CSV</button>
        <button id="reset-btn">Clear Round</button>
    </header>

    <main id="course-container">
        <section id="course-config">
    <label for="tee-selector">Playing From:</label>
    <select id="tee-selector">
        <option value="blue">Blue (Back)</option>
        <option value="white" selected>White (Middle)</option>
        <option value="green">Green (Forward)</option>
        <option value="gold">Gold (Championship)</option>
    </select>
</section>
        <!-- Holes 1-18 will be injected here via JavaScript -->
    </main>

    <script src="script.js"></script>
</body>
</html>
