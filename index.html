<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Hiawatha Links Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Hiawatha Tracker</h1>
        <div class="header-actions">
            <button id="export-btn" class="btn-blue">Export</button>
            <button id="reset-btn" class="btn-red">Reset</button>
        </div>
    </header>

    <section id="course-config">
        <label for="tee-selector">Tees:</label>
        <select id="tee-selector">
            <option value="gold">Gold (Championship)</option>
            <option value="blue">Blue (Back)</option>
            <option value="white" selected>White (Middle)</option>
            <option value="green">Green (Forward)</option>
        </select>
    </section>

    <main id="course-container">
        <!-- Holes injected via JS -->
    </main>

    <script src="script.js"></script>
</body>
</html>
